<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pra 22</title>
  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #e5e7eb;

    font-family: Arial, sans-serif;
}


.calculator {
    width: 320px;

    padding: 20px;

    background: #111827;

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2);
}


#display {
    width: 100%;

    height: 70px;

    margin-bottom: 20px;

    padding: 10px;

    border: none;

    border-radius: 10px;

    background: #1f2937;

    color: white;

    font-size: 32px;

    text-align: right;

    outline: none;
}


.buttons {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


.buttons button {
    height: 60px;

    border: none;

    border-radius: 12px;

    background: #374151;

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        background 0.2s ease;
}


.buttons button:hover {
    background: #4b5563;
}


.buttons button:active {
    transform: scale(0.94);
}


.buttons .zero {
    grid-column: span 2;
}.buttons .operator {
    background: #2563eb;
}

.buttons .operator:hover {
    background: #1d4ed8;
}

.buttons .equals {
    background: #16a34a;
}

.buttons .equals:hover {
    background: #15803d;
}

.buttons button:first-child {
    background: #dc2626;
}

.buttons button:first-child:hover {
    background: #b91c1c;
}.buttons .delete {
    background: #f59e0b;
}

.buttons .delete:hover {
    background: #d97706;
}function addToDisplay(value) {

    if (
        display.value === "0" ||
        display.value === "Error"
    ) {

        display.value = value;

    } else {

        display.value += value;

    }

}
  </style>
</head>
<body>
<div class="calculator">

    <input
        type="text"
        id="display"
        value="0"
        readonly
    >

    <div class="buttons">

        <button onclick="clearDisplay()">C</button>
        <button class="delete onclick="deleteLast()">⌫</button>
        <button onclick="addToDisplay('%')">%</button>
        <button class="operator" onclick="addToDisplay('/')">÷</button>

        <button onclick="addToDisplay('7')">7</button>
        <button onclick="addToDisplay('8')">8</button>
        <button onclick="addToDisplay('9')">9</button>
        <button class="operator" onclick="addToDisplay('*')">×</button>

        <button onclick="addToDisplay('4')">4</button>
        <button onclick="addToDisplay('5')">5</button>
        <button onclick="addToDisplay('6')">6</button>
        <button class="operator" onclick="addToDisplay('-')">−</button>

        <button onclick="addToDisplay('1')">1</button>
        <button onclick="addToDisplay('2')">2</button>
        <button onclick="addToDisplay('3')">3</button>
        <button class="operator" onclick="addToDisplay('+')">+</button>

        <button onclick="addToDisplay('0')" class="zero">
            0
        </button>

        <button onclick="addToDisplay('.')">.</button>
        <button onclick="calculate()">=</button>

    </div>

</div>
  <script>
var display = document.getElementById("display");


function addToDisplay(value) {

    if (display.value === "0") {
        display.value = value;
    } else {
        display.value += value;
    }

}function calculate() {

    try {

        display.value = eval(display.value);

    } catch (error) {

        display.value = "Error";

    }

}function clearDisplay() {

    display.value = "0";

}function deleteLast() {

    if (display.value.length > 1) {

        display.value =
            display.value.slice(0, -1);

    } else {

        display.value = "0";

    }

}
  </script>
</body>
</html>
