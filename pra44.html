weatherAlert.textContent =

}function convertTemperature(celsius) {

}function getWeatherAlert(code) {

    if (code >= 95) {
        return "⛈️ Thunderstorm expected.";
    }

    if (code >= 80 && code <= 82) {
        return "🌧️ Rain showers expected.";
    }

    if (code >= 51 && code <= 67) {
        return "🌧️ Rainy weather.";
    }

    if (code >= 71 && code <= 77) {
        return "❄️ Snowy weather.";
    }

    return "";

    var city =
        cityInput.value.trim();


    if (city === "") {

        message.innerHTML =
            "<p>Please enter a city first.</p>";

        return;
    }


    message.innerHTML =
        "<p>Refreshing weather...</p>";


    var searchURL =
        "https://geocoding-api.open-meteo.com/v1/search"
        + "?name=" +
        encodeURIComponent(city)
        + "&count=1"
        + "&language=en"
        + "&format=json";


    fetch(searchURL)

    .then(function(response) {

        return response.json();

    })

    .then(function(data) {

        if (!data.results ||
            data.results.length === 0) {

            message.innerHTML =
                "<p>City not found.</p>";

            return;
        }


        var location =
            data.results[0];


        var lat =
            location.latitude;

        var lon =
            location.longitude;

            "https://api.open-meteo.com/v1/forecast"
            + "?latitude=" + lat

            + "&temperature_unit=celsius"
            + "&wind_speed_unit=kmh"
            + "&timezone=auto";

}if (unitButton) {

    unitButton.addEventListener("click", function () {

        var forecastCards =
            document.getElementsByClassName("forecast-card");

        for (var i = 0; i < forecastCards.length; i++) {

            var values =
                forecastCards[i].getElementsByTagName("div");

            for (var j = 0; j < values.length; j++) {

                var text =
                    values[j].textContent;

                if (
                    text.indexOf("MAX:") !== -1 ||
                    text.indexOf("MIN:") !== -1
                ) {

                    var number =
                        parseFloat(text.match(/[-+]?\d+(\.\d+)?/));

                    if (!isNaN(number)) {

                        if (fahrenheit) {

                            number =
                                Math.round(
                                    (number * 9 / 5) + 32
                                );

                            values[j].textContent =
                                text.replace(
                                    /[-+]?\d+(\.\d+)?/,
                                    number
                                ).replace(
                                    "°C",
                                    "°F"
                                );

                        }
                    }
                }
            }
        }

    });

}
